<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>陈旭东 · 作品集 | Chen Xudong Portfolio</title>
<meta name="description" content="陈旭东 · 视觉传达设计（广告设计方向）作品集，涵盖 AI 产品、内容运营、品牌视觉。" />
<style>
  :root{
    --bg:#fafafa; --card:#ffffff; --ink:#1a1a1a; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-ink:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* 顶部导航 */
  header{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;padding:10px 18px}
  .brand{font-weight:700;letter-spacing:.5px;white-space:nowrap}
  .brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:1px}
  .chips{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px 0}
  .chips a{
    flex:0 0 auto;font-size:13px;color:var(--muted);
    padding:6px 12px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;
  }
  .chips a:hover{color:var(--ink);border-color:#c9ccd1}
  .dl{display:flex;gap:8px;flex:0 0 auto}
  .btn{
    font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--accent);
    color:var(--accent);background:#fff;white-space:nowrap;
  }
  .btn.primary{background:var(--accent);color:var(--accent-ink)}

  /* Hero */
  .hero{max-width:1100px;margin:0 auto;padding:36px 18px 8px}
  .hero h1{font-size:30px;letter-spacing:.5px}
  .hero .en{color:var(--muted);font-size:14px;letter-spacing:2px;margin-top:4px}
  .hero p{max-width:680px;color:#374151;margin-top:14px}
  .hero .cover{margin-top:22px;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  .hero .cover img{display:block;width:100%;height:auto}

  /* 区块 */
  section{max-width:1100px;margin:0 auto;padding:40px 18px}
  .sec-head{display:flex;align-items:baseline;gap:12px;border-left:4px solid var(--accent);padding-left:12px;margin-bottom:18px}
  .sec-head h2{font-size:20px}
  .sec-head .en{color:var(--muted);font-size:12px;letter-spacing:1.5px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  figure{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.04)}
  figure img{display:block;width:100%;height:auto}
  .page-no{font-size:11px;color:var(--muted);padding:6px 10px;text-align:right}

  footer{max-width:1100px;margin:0 auto;padding:30px 18px 60px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
  .top{display:inline-block;margin-top:10px;color:var(--accent)}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .hero h1{font-size:24px}
    .dl .btn{padding:6px 10px}
    .nav{gap:8px}
  }
</style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="brand">陈旭东<small>PORTFOLIO 2026</small></div>
      <nav class="chips" id="chips"></nav>
      <div class="dl">
        <a class="btn" href="./downloads/portfolio-light.pdf">轻量 PDF</a>
        <a class="btn primary" href="./downloads/portfolio-full.pdf">完整 PDF</a>
      </div>
    </div>
  </header>

  <div class="hero">
    <h1>陈旭东 · 作品集</h1>
    <div class="en">CHEN XUDONG — VISUAL & AI PRODUCT DESIGN</div>
    <p>中国传媒大学 · 视觉传达设计（广告设计方向）。聚焦 AI 产品视觉、内容运营与品牌设计，作品涵盖智能体定制、动漫内容运营、AI 漫剧交付与交互装置。</p>
    <div class="cover"><img src="./images/p01.webp" alt="作品集封面" /></div>
  </div>

  <main id="root"></main>

  <footer>
    <div>© 2026 陈旭东 · 视觉传达设计作品集</div>
    <a class="top" href="#top">↑ 返回顶部</a>
  </footer>

<script>
  // 板块划分（页码对应 PDF 页，1 基）
  const SECTIONS = [
    {id:'cover',   cn:'封面与简介', en:'Cover & Intro',                 from:1,  to:3},
    {id:'mofa',    cn:'魔法公主的小烦恼', en:'Little Troubles of Magic',  from:4,  to:20},
    {id:'cube',    cn:'超能立方：超凡篇',  en:'Super Cube: Transcendent',  from:21, to:34},
    {id:'mango',   cn:'芒果TV · AI漫剧运营', en:'Mango TV · AI Drama Ops', from:35, to:42},
    {id:'xiangbang',cn:'想帮帮 · AI-3D定制', en:'Xiangbangbang · AI-3D',   from:43, to:54},
    {id:'others',  cn:'其他作品', en:'Other Works',                     from:55, to:66},
  ];

  const pad = n => String(n).padStart(2,'0');
  const chips = document.getElementById('chips');
  const root = document.getElementById('root');

  SECTIONS.forEach(s=>{
    const a = document.createElement('a');
    a.href = '#'+s.id; a.textContent = s.cn;
    chips.appendChild(a);

    const sec = document.createElement('section');
    sec.id = s.id;
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.innerHTML = `<h2>${s.cn}</h2><span class="en">${s.en}</span>`;
    sec.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'grid';
    for(let p=s.from; p<=s.to; p++){
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = `./images/p${pad(p)}.webp`;
      img.loading = 'lazy';
      img.alt = `${s.cn} P${p}`;
      img.width = 1600; img.height = 898;
      const cap = document.createElement('div');
      cap.className = 'page-no';
      cap.textContent = `P${p}`;
      fig.appendChild(img); fig.appendChild(cap);
      grid.appendChild(fig);
    }
    sec.appendChild(grid);
    root.appendChild(sec);
  });
</script>
</body>
</html>
